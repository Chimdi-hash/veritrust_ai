<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeriTrust AI — Decentralized Oracle Validation</title>
    <style>
        :root {
            --bg-dark: #0B0F19;
            --card-bg: #111827;
            --primary-accent: #3B82F6;
            --primary-hover: #2563EB;
            --success-green: #10B981;
            --error-red: #EF4444;
            --text-main: #F9FAFB;
            --text-muted: #9CA3AF;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Navigation Header bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background-color: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #1F2937;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, #3B82F6, #10B981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .wallet-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        #walletDisplay {
            display: none;
            font-size: 0.875rem;
            font-family: monospace;
            background: #1F2937;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            border: 1px solid #374151;
            color: var(--text-main);
        }

        .btn-connect {
            background-color: var(--primary-accent);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-connect:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        /* Layout Container */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background-color: var(--card-bg);
            border: 1px solid #1F2937;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 1.75rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        /* Error Message display block */
        #errorBanner {
            display: none;
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error-red);
            color: #FCA5A5;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
        }

        /* Form elements */
        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background-color: #1F2937;
            border: 1px solid #374151;
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-accent);
        }

        .btn-main {
            width: 100%;
            background-color: #1F2937;
            /* Greyed out until wallet connection active */
            color: #9CA3AF;
            border: 1px solid #374151;
            padding: 0.85rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: not-allowed;
            transition: all 0.2s;
            margin-top: 1rem;
        }

        /* Active styling applied by JavaScript */
        .btn-main:not(:disabled) {
            background-color: var(--primary-accent);
            color: white;
            border: none;
            cursor: pointer;
        }

        .btn-main:not(:disabled):hover {
            background-color: var(--primary-hover);
        }

        /* Result display dashboard card */
        .result-container {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #1F2937;
            text-align: center;
        }

        .result-title {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        #statusCard {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.02em;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">VERITRUST AI</div>
        <div class="wallet-actions">
            <div id="walletDisplay">Not Connected</div>
            <button id="connectBtn" class="btn-connect">Connect Wallet</button>
        </div>
    </header>

    <main>
        <div class="container">
            <h1>Web Consensus Oracle</h1>
            <p class="subtitle">Scrape real-world URL data and execute multi-validator LLM truth consensus.</p>

            <div id="errorBanner"></div>

            <div class="form-group">
                <label for="urlInput">Target Content URL</label>
                <input type="url" id="urlInput" placeholder="https://example.com/article" required>
            </div>

            <div class="form-group">
                <label for="claimInput">Target Validation Claim</label>
                <input type="text" id="claimInput" placeholder="Enter specific data claim to verify..." required>
            </div>

            <button id="verifyBtn" class="btn-main" disabled>Verify via GenLayer</button>

            <div class="result-container">
                <div class="result-title">Consensus Resolution Status</div>
                <div id="statusCard">NOT_YET_EVALUATED</div>
            </div>
        </div>
    </main>

    <script src="genlayerclient.js"></script>
    <script src="app.js"></script>
</body>

</html>
